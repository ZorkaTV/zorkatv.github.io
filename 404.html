<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZorkaTV</title>
<meta name="description" content="Ссылка на передачу или канал в ZorkaTV">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
  :root { --sky0:#05060F; --sky1:#0B1030; --sky2:#2A1C3A; --sky3:#7A3B2A; --sky4:#E0873A; --amber:#FFB547; --text:#F4F4F6; --muted:#C9C9D6; --dim:#8A8A94; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh; color: var(--text);
    font-family: -apple-system, system-ui, "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(180deg, var(--sky0) 0%, var(--sky1) 38%, var(--sky2) 62%, var(--sky3) 82%, var(--sky4) 100%) fixed;
    display: flex; align-items: center; justify-content: center; padding: 24px 16px;
  }
  .card {
    width: 100%; max-width: 440px; padding: 28px 24px; border-radius: 28px;
    background: rgba(16,16,28,0.62); border: 1px solid rgba(255,255,255,0.16);
    backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 20px 50px rgba(0,0,0,0.45);
    display: flex; flex-direction: column; gap: 14px; text-align: center;
  }
  .brand { display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 800; font-size: 22px; }
  .brand img { width: 40px; height: 40px; border-radius: 10px; }
  .kind { font-size: 13px; letter-spacing: .6px; text-transform: uppercase; color: var(--dim); }
  h1 { margin: 0; font-size: 26px; line-height: 1.2; }
  .when { color: var(--muted); font-size: 16px; }
  .btn {
    display: block; margin-top: 8px; padding: 15px; border-radius: 16px; text-decoration: none;
    background: var(--amber); color: #1A1206; font-weight: 700; font-size: 17px;
  }
  .note { color: var(--muted); font-size: 14px; line-height: 1.45; }
  .small { color: var(--dim); font-size: 12px; }
  @media (prefers-reduced-motion: no-preference) { .card { animation: rise .5s ease-out both; } @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } } }
</style>
</head>
<body>
<main class="card">
  <div class="brand"><img src="/icon.svg" alt="">ZorkaTV</div>
  <div class="kind" id="kind"></div>
  <h1 id="title"></h1>
  <div class="when" id="when"></div>
  <a class="btn" id="open" href="zorkatv://">Открыть в ZorkaTV</a>
  <p class="note" id="note"></p>
  <p class="small" id="small"></p>
</main>
<script>
(function () {
  var lang = (navigator.language || 'ru').slice(0, 2);
  var T = {
    ru: { prog: 'Передача', live: 'Канал в эфире', rec: 'Запись', title: 'Ссылка ZorkaTV', open: 'Открыть в ZorkaTV',
          note: 'Если приложение уже установлено, ссылка открывается в нём сразу. Если открылась эта страница — нажмите кнопку.',
          small: 'ZorkaTV — приложение для просмотра ТВ по вашей подписке. Время указано по Минску.', bad: 'Ссылка неполная или устарела.' },
    be: { prog: 'Перадача', live: 'Канал у эфіры', rec: 'Запіс', title: 'Спасылка ZorkaTV', open: 'Адкрыць у ZorkaTV',
          note: 'Калі праграма ўжо ўсталявана, спасылка адкрываецца ў ёй адразу. Калі адкрылася гэтая старонка — націсніце кнопку.',
          small: 'ZorkaTV — праграма для прагляду ТБ па вашай падпісцы. Час — па Мінску.', bad: 'Спасылка няпоўная або састарэла.' },
    en: { prog: 'Programme', live: 'Live channel', rec: 'Recording', title: 'ZorkaTV link', open: 'Open in ZorkaTV',
          note: 'If the app is installed, the link opens in it right away. If you see this page, tap the button.',
          small: 'ZorkaTV is an app for watching TV from your subscription. Times are Minsk time.', bad: 'The link is incomplete or out of date.' }
  };
  var t = T[lang] || T.ru;
  var parts = location.pathname.replace(/^\/+|\/+$/g, '').split('/').map(decodeURIComponent);
  var kind = parts[0], channel = parts[1] || '', start = parseInt(parts[2] || '', 10);
  var q = new URLSearchParams(location.search);
  var deep = null, k = '', when = '';
  function fmt(sec) {
    try {
      return new Intl.DateTimeFormat(lang, { timeZone: 'Europe/Minsk', weekday: 'short', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }).format(new Date(sec * 1000));
    } catch (e) { return new Date(sec * 1000).toISOString(); }
  }
  if (kind === 'p' && channel && start) { deep = 'zorkatv://programme/' + encodeURIComponent(channel) + '/' + start; k = t.prog; when = fmt(start); }
  else if (kind === 'live' && channel) { deep = 'zorkatv://live/' + encodeURIComponent(channel); k = t.live; }
  else if (kind === 'a' && channel && start) { deep = 'zorkatv://archive/' + encodeURIComponent(channel) + '/' + start + (q.get('t') ? '?t=' + encodeURIComponent(q.get('t')) : ''); k = t.rec; when = fmt(start); }
  var name = q.get('n');
  document.getElementById('kind').textContent = k;
  document.getElementById('title').textContent = name || (deep ? t.title : t.bad);
  document.getElementById('when').textContent = when;
  var open = document.getElementById('open');
  open.textContent = t.open;
  if (deep) { open.href = deep; } else { open.style.display = 'none'; }
  document.getElementById('note').textContent = deep ? t.note : '';
  document.getElementById('small').textContent = t.small;
  document.documentElement.lang = T[lang] ? lang : 'ru';
})();
</script>
</body>
</html>
