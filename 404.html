<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZorkaTV</title>
<meta name="description" content="Ссылка на передачу или канал в ZorkaTV">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#05060F">
<style>
  :root { --amber:#FFB547; --text:#F4F4F6; --muted:#D8D3DE; --dim:#A9A3B4; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  /* The sky of the sign-in screen «Заря», the same as the landing page's hero, in both themes. */
  body {
    position: relative; isolation: isolate; overflow-x: hidden;
    min-height: 100vh; min-height: 100dvh; color: var(--text); -webkit-font-smoothing: antialiased;
    font-family: -apple-system, BlinkMacSystemFont, system-ui, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(180deg, #05060F 0%, #0B1030 34%, #2A1C3A 56%, #7A3B2A 74%, #E0873A 88%, #FFB547 100%) fixed;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  .stars { position: fixed; inset: 0 0 45% 0; z-index: -2; opacity: .8; pointer-events: none;
    background-image:
      radial-gradient(1.5px 1.5px at 8% 18%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 22% 8%, #fff 50%, transparent 51%),
      radial-gradient(1.2px 1.2px at 35% 26%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 48% 12%, #fff 50%, transparent 51%),
      radial-gradient(1.6px 1.6px at 63% 22%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 74% 6%, #fff 50%, transparent 51%),
      radial-gradient(1.3px 1.3px at 86% 30%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 93% 14%, #fff 50%, transparent 51%); }
  .sun { position: fixed; z-index: -1; left: 50%; bottom: 0; width: clamp(720px, 120vw, 1600px); aspect-ratio: 1; border-radius: 50%; pointer-events: none;
    transform: translate(-50%, 62%); background: radial-gradient(closest-side, rgba(255,214,140,.85), rgba(255,181,71,.45) 42%, rgba(255,181,71,0) 72%); }
  .card {
    width: 100%; max-width: 440px; padding: 28px 24px; border-radius: 28px;
    background: rgba(16,16,28,0.6); border: 1px solid rgba(255,255,255,0.16);
    -webkit-backdrop-filter: blur(24px) saturate(160%); backdrop-filter: blur(24px) saturate(160%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 24px 60px -20px rgba(0,0,0,0.6);
    display: flex; flex-direction: column; gap: 14px; text-align: center;
  }
  .brand { display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 800; font-size: 22px; letter-spacing: -0.2px; }
  .brand img { width: 40px; height: 40px; border-radius: 10px; box-shadow: 0 0 0 1px rgba(255,255,255,.14), 0 0 30px rgba(255,181,71,.25); }
  .kind { font-size: 13px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--amber); }
  .kind:empty, .when:empty, .note:empty, .small:empty { display: none; }
  h1 { margin: 0; font-size: 26px; line-height: 1.2; letter-spacing: -0.3px; }
  .when { color: var(--muted); font-size: 16px; }
  .btn {
    display: flex; align-items: center; justify-content: center; min-height: 52px; margin-top: 8px; padding: 0 16px; border-radius: 18px; text-decoration: none;
    background: linear-gradient(180deg, #FFC56E, #FFB547 60%, #F2A12F); color: #1A1206; font-weight: 700; font-size: 17px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.55), 0 14px 34px -10px rgba(255,160,50,.65);
  }
  .btn2 { display: flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 16px; border-radius: 18px; text-decoration: none;
    color: var(--text); font-weight: 650; font-size: 16px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.2); }
  .btn2:hover { background: rgba(255,255,255,.13); }
  .btn:focus-visible, .btn2:focus-visible, .home:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }
  .note { color: var(--muted); font-size: 14px; line-height: 1.45; }
  .small { color: var(--dim); font-size: 12px; line-height: 1.45; }
  .home { color: var(--text); font-size: 14px; font-weight: 600; text-decoration: none; padding: 9px 16px; border-radius: 999px;
    background: rgba(16,16,28,.5); border: 1px solid rgba(255,255,255,.18); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
  .home:hover { background: rgba(16,16,28,.65); }
  @media (prefers-reduced-motion: no-preference) { .card { animation: rise .5s ease-out both; } @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } } }
</style>
</head>
<body>
<div class="stars" aria-hidden="true"></div>
<div class="sun" aria-hidden="true"></div>
<main class="card">
  <div class="brand"><img src="/icon.svg" alt="" width="40" height="40">ZorkaTV</div>
  <div class="kind" id="kind"></div>
  <h1 id="title"></h1>
  <div class="when" id="when"></div>
  <a class="btn" id="open" href="zorkatv://">Открыть в ZorkaTV</a>
  <a class="btn2" id="install" href="/">Установить ZorkaTV</a>
  <p class="note" id="note"></p>
  <p class="note" id="device"></p>
  <p class="small" id="small"></p>
</main>
<a class="home" href="/">zorkatv.github.io</a>
<script>
(function () {
  var lang = (navigator.language || 'ru').slice(0, 2);
  var T = {
    ru: { prog: 'Передача', live: 'Канал в эфире', rec: 'Запись', title: 'Ссылка ZorkaTV', open: 'Открыть в ZorkaTV', install: 'Установить ZorkaTV',
          device: 'ZorkaTV работает на iPhone, iPad и Mac с Apple silicon. Откройте эту ссылку на одном из них.',
          note: 'Если приложение уже установлено, ссылка открывается в нём сразу. Если открылась эта страница — нажмите «Открыть». Приложения ещё нет — «Установить».',
          small: 'ZorkaTV — приложение для просмотра ТВ по вашей подписке. Время указано по Минску.', bad: 'Ссылка неполная или устарела.' },
    be: { prog: 'Перадача', live: 'Канал у эфіры', rec: 'Запіс', title: 'Спасылка ZorkaTV', open: 'Адкрыць у ZorkaTV', install: 'Усталяваць ZorkaTV',
          device: 'ZorkaTV працуе на iPhone, iPad і Mac з Apple silicon. Адкрыйце гэтую спасылку на адным з іх.',
          note: 'Калі праграма ўжо ўсталявана, спасылка адкрываецца ў ёй адразу. Калі адкрылася гэтая старонка — націсніце «Адкрыць». Праграмы яшчэ няма — «Усталяваць».',
          small: 'ZorkaTV — праграма для прагляду ТБ па вашай падпісцы. Час — па Мінску.', bad: 'Спасылка няпоўная або састарэла.' },
    en: { prog: 'Programme', live: 'Live channel', rec: 'Recording', title: 'ZorkaTV link', open: 'Open in ZorkaTV', install: 'Install ZorkaTV',
          device: 'ZorkaTV runs on iPhone, iPad and Macs with Apple silicon. Open this link on one of them.',
          note: 'If the app is installed, the link opens in it right away. If you see this page, tap “Open”. No app yet? Tap “Install”.',
          small: 'ZorkaTV is an app for watching TV from your subscription. Times are Minsk time.', bad: 'The link is incomplete or out of date.' }
  };
  var t = T[lang] || T.ru;
  // Short links (ZorkaTV DeepLink.webURL): channel `_` + base 62 of the 20 digits of `ch…`, else the code itself;
  // start in base 62: 5 characters = minutes since 1970, 6 = seconds. Links shared before: the plain code, Unix
  // seconds (9–12 digits) and `?n=<title>`.
  var B62 = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
  function b62(text) {
    var v = BigInt(0);
    for (var i = 0; i < text.length; i++) {
      var d = B62.indexOf(text[i]);
      if (d < 0) return null;
      v = v * BigInt(62) + BigInt(d);
    }
    return text.length ? v : null;
  }
  function decodeChannel(seg) {
    if (!seg) return '';
    if (seg[0] === '_') {
      var short = seg.slice(1);
      if (short.length < 1 || short.length > 12) return '';
      var v = b62(short);
      if (v === null) return '';
      var digits = v.toString();
      if (digits.length > 20) return '';
      return 'ch' + '0'.repeat(20 - digits.length) + digits;
    }
    try { return decodeURIComponent(seg); } catch (e) { return ''; }
  }
  function decodeStart(seg) {
    var sec = NaN;
    if (!seg) return NaN;
    if (seg.length >= 9) { sec = /^[0-9]+$/.test(seg) ? parseInt(seg, 10) : NaN; }
    else if (seg.length === 5 || seg.length === 6) {
      var v = b62(seg);
      if (v !== null) sec = Number(v) * (seg.length === 5 ? 60 : 1);
    }
    return (sec >= 946684800 && sec <= 4102444800) ? sec : NaN;
  }
  var parts = location.pathname.replace(/^\/+|\/+$/g, '').split('/');
  var kind = parts[0], channel = parts.length >= 2 ? decodeChannel(parts[1]) : '', start = decodeStart(parts[2] || '');
  var shape = (kind === 'live' && parts.length === 2) || ((kind === 'p' || kind === 'a') && parts.length === 3);
  var q = new URLSearchParams(location.search);
  var deep = null, k = '', when = '';
  function fmt(sec) {
    try {
      return new Intl.DateTimeFormat(lang, { timeZone: 'Europe/Minsk', weekday: 'short', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }).format(new Date(sec * 1000));
    } catch (e) { return new Date(sec * 1000).toISOString(); }
  }
  var offset = /^[0-9]+(\.[0-9]+)?$/.test(q.get('t') || '') ? q.get('t') : '';
  if (!shape) {}
  else if (kind === 'p' && channel && start) { deep = 'zorkatv://programme/' + encodeURIComponent(channel) + '/' + start; k = t.prog; when = fmt(start); }
  else if (kind === 'live' && channel) { deep = 'zorkatv://live/' + encodeURIComponent(channel); k = t.live; }
  else if (kind === 'a' && channel && start) { deep = 'zorkatv://archive/' + encodeURIComponent(channel) + '/' + start + (offset ? '?t=' + offset : ''); k = t.rec; when = fmt(start); }
  // The title comes only with links shared before (`?n=`); short links show the kind («Передача») and the time.
  var name = deep ? q.get('n') : null;
  if (!name && deep) { name = k; k = ''; }
  document.getElementById('kind').textContent = k;
  document.getElementById('title').textContent = name || (deep ? t.title : t.bad);
  document.getElementById('when').textContent = when;
  var open = document.getElementById('open');
  open.textContent = t.open;
  if (deep) { open.href = deep; } else { open.style.display = 'none'; }
  document.getElementById('note').textContent = deep ? t.note : '';
  document.getElementById('small').textContent = t.small;
  // Where «Установить» leads: the site for now; the public TestFlight link, later the App Store page.
  var INSTALL_URL = '/';
  var install = document.getElementById('install');
  install.textContent = t.install;
  install.href = INSTALL_URL;
  var ua = navigator.userAgent || '';
  var apple = /iPhone|iPad|iPod|Macintosh/.test(ua);
  document.getElementById('device').textContent = apple ? '' : t.device;
  document.documentElement.lang = T[lang] ? lang : 'ru';
})();
</script>
</body>
</html>
